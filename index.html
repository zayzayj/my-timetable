
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Timetable</title>
<link rel="icon" href="data:image/svg+xml,
%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📅%3C/text%3E%3C/svg%3E">


  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px;
      font-family: "Times New Roman", serif;
      background: #f7f7f2;
      color: #292d29;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 48px;
      letter-spacing: 3px;
      margin: 0;
    }

    button { font-family: inherit; }

    .clear-button {
      background: #476b50;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
    }

    .weekdays, #calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekdays div {
      background: #dce9dd;
      color: #365540;
      text-align: center;
      padding: 15px 2px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      border: 1px solid #cbd9cc;
    }

    #calendar {
      border-top: 0;
      border-left: 1px solid #d9ddd6;
    }

    .day {
      height: 160px;
      min-width: 0;
      padding: 7px;
      background: white;
      border: 0;
      border-right: 1px solid #d9ddd6;
      border-bottom: 1px solid #d9ddd6;
      text-align: left;
      overflow-y: auto;
      overflow-wrap: anywhere;
      cursor: pointer;
    }

    .day:hover { background: #f8faf7; }

    .day-number {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 13px;
    }

    .task {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 0;
      margin: 5px 0;
      padding: 6px;
      border: 0;
      border-radius: 5px;
      text-align: left;
      color: #292d29;
      cursor: pointer;
    }

    .task:hover { filter: brightness(0.96); }

    .task-title {
      font-size: 12px;
      font-weight: bold;
    }

    .task-notes {
      margin-top: 5px;
      padding-top: 4px;
      border-top: 1px solid #00000018;
      font-size: 10px;
      font-style: italic;
      line-height: 1.3;
      white-space: pre-wrap;
    }

    .green { background: #e0eee0; }
    .blue { background: #e0ebf8; }
    .pink { background: #f7e3e6; }
    .yellow { background: #f8efcc; }
    .purple { background: #ece5fa; }

    dialog {
      width: min(420px, 90%);
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 24px;
    }

    dialog::backdrop { background: #0006; }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 14px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font: inherit;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .actions button {
      padding: 10px 13px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .save {
      background: #476b50;
      color: white;
    }

    .delete {
      margin-right: auto;
      color: #a33;
      background: white;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      h1 { font-size: 27px; letter-spacing: 1px; }
      .day { height: 125px; padding: 4px; }
      .task { padding: 4px; }
      .task-title { font-size: 10px; }
      .task-notes { font-size: 9px; }
      .weekdays div {
        font-size: 9px;
        letter-spacing: 0;
        padding: 12px 1px;
      }
    }
  </style>
</head>

<body>
<header class="header">
  <h1>TIMETABLE</h1>

  <div>
      <button class="clear-button" id="clearAll">
      Clear All
    </button>
  </div>
</header>


  <div class="weekdays">
    <div>MONDAY</div>
    <div>TUESDAY</div>
    <div>WEDNESDAY</div>
    <div>THURSDAY</div>
    <div>FRIDAY</div>
    <div>SATURDAY</div>
    <div>SUNDAY</div>
  </div>

  <main id="calendar"></main>

  <dialog id="editor">
    <form id="taskForm">
      <h2 id="dayTitle">Edit task</h2>

<label for="boxDate">Date for this box (optional)</label>
<input id="boxDate" type="date">
<button type="button" id="saveDate">Save date</button>


      <label for="taskTitle">What's on the agenda?</label>
      <input id="taskTitle" maxlength="150"
             placeholder="e.g. Lecture Notes">

      <label for="taskDetails">Notes</label>
      <textarea id="taskDetails" rows="4"
                placeholder="Add reminders or extra details..."></textarea>

      <label for="taskColour">Choose a colour</label>
      <select id="taskColour">
        <option value="green">Green</option>
        <option value="blue">Blue</option>
        <option value="pink">Pink</option>
        <option value="yellow">Yellow</option>
        <option value="purple">Lavender</option>
      </select>

      <div class="actions">
        <button type="button" class="delete" id="deleteTask">
          Delete
        </button>
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="save">Save</button>
      </div>
    </form>
  </dialog>

  <script>
    const calendar = document.getElementById("calendar");
    const editor = document.getElementById("editor");
    const form = document.getElementById("taskForm");

let activeDay = null;
let activeTaskIndex = null;
let tasks = {};

let dates = {};

try {
  dates = JSON.parse(localStorage.getItem("myTimetableDates") || "{}");
  if (!dates || typeof dates !== "object" || Array.isArray(dates)) {
    dates = {};
  }
} catch {
  dates = {};
}


    const colours = ["green", "blue", "pink", "yellow", "purple"];

    // Load saved tasks and convert the old one-task format if necessary.
    try {
      const saved = JSON.parse(
        localStorage.getItem("myTimetable") || "{}"
      );

      if (saved && typeof saved === "object" && !Array.isArray(saved)) {
        for (const day in saved) {
          const entry = saved[day];

          if (Array.isArray(entry)) {
            tasks[day] = entry.filter(
              task => task && typeof task === "object"
            );
          } else if (entry && typeof entry === "object") {
            tasks[day] = [entry];
          }
        }
      }
    } catch {
      tasks = {};
    }

    function saveTasks() {
      try {
        localStorage.setItem("myTimetable", JSON.stringify(tasks));
        return true;
      } catch {
        alert("Could not save your timetable in this browser.");
        return false;
      }
    }

    function renderCalendar() {
      calendar.replaceChildren();

      for (let day = 1; day <= 31; day++) {
        const cell = document.createElement("div");
        cell.className = "day";
 
        // Clicking the empty area adds another task.
        cell.addEventListener("click", () => openEditor(day, null));

const number = document.createElement("span");
number.className = "day-number";



let displayDate = "";

const startingDay = Object.keys(dates)
  .map(Number)
  .filter(box => dates[box] && box <= day)
  .sort((a, b) => b - a)[0];

if (startingDay !== undefined) {
  const date = new Date(dates[startingDay] + "T12:00:00");
  date.setDate(date.getDate() + (day - startingDay));
  displayDate = date.getDate();
}

number.textContent = displayDate;
cell.appendChild(number);


        const dayTasks = Array.isArray(tasks[day]) ? tasks[day] : [];

        dayTasks.forEach((task, index) => {
          const bubble = document.createElement("button");
          bubble.type = "button";

          const colour = colours.includes(task.colour)
            ? task.colour : "green";

          bubble.className = "task " + colour;
          bubble.title = "Click to edit this task";

          const title = document.createElement("span");
          title.className = "task-title";
          title.textContent = task.title || "(Untitled task)";
          bubble.appendChild(title);

          if (task.details) {
            const notes = document.createElement("span");
            notes.className = "task-notes";
            notes.textContent = task.details;
            bubble.appendChild(notes);
          }

          // Clicking a bubble edits that specific task only.
          bubble.addEventListener("click", event => {
            event.stopPropagation();
            openEditor(day, index);
          });

          cell.appendChild(bubble);
        });

        calendar.appendChild(cell);
      }
    }

function openEditor(day, taskIndex) {
  activeDay = day;
  activeTaskIndex = taskIndex;

  const existing = taskIndex !== null
    ? tasks[day][taskIndex]
    : null;


document.getElementById("dayTitle").textContent =
    existing ? "Edit task" : "Add task";


  document.getElementById("taskTitle").value =
    existing?.title || "";

  document.getElementById("taskDetails").value =
    existing?.details || "";

  document.getElementById("taskColour").value =
    colours.includes(existing?.colour) ? existing.colour : "green";

  document.getElementById("boxDate").value =
    dates[day] || "";

  document.getElementById("deleteTask").hidden = !existing;

  editor.showModal();
}


    form.addEventListener("submit", event => {
      event.preventDefault();

      const title = document.getElementById("taskTitle")
        .value.trim();

      const details = document.getElementById("taskDetails")
        .value.trim();

      const colour = document.getElementById("taskColour").value;

      if (!title) {
        alert("Please enter a task title.");
        return;
      }

      const previous = JSON.stringify(tasks[activeDay] || []);

      if (!tasks[activeDay]) tasks[activeDay] = [];

      const newTask = { title, details, colour };

      if (activeTaskIndex === null) {
        // Add a new task without replacing other tasks.
        tasks[activeDay].push(newTask);
      } else {
        // Edit only the selected task.
        tasks[activeDay][activeTaskIndex] = newTask;
      }

      if (!saveTasks()) {
        tasks[activeDay] = JSON.parse(previous);
        if (tasks[activeDay].length === 0) delete tasks[activeDay];
        return;
      }

      editor.close();
      renderCalendar();
    });

    document.getElementById("deleteTask").addEventListener("click", () => {
      if (activeTaskIndex === null) return;

      const previous = JSON.stringify(tasks[activeDay]);

      tasks[activeDay].splice(activeTaskIndex, 1);

      if (tasks[activeDay].length === 0) {
        delete tasks[activeDay];
      }

      if (!saveTasks()) {
        tasks[activeDay] = JSON.parse(previous);
        return;
      }

      editor.close();
      renderCalendar();
    });

    document.getElementById("cancel").addEventListener("click", () => {
      editor.close();
    });


document.getElementById("clearAll").addEventListener("click", () => {
  if (!confirm("Are you sure you want to clear all your timetable entries and dates?")) {
    return;
  }

  tasks = {};
  dates = {};

  try {
    localStorage.removeItem("myTimetable");
    localStorage.removeItem("myTimetableDates");
  } catch {
    alert("Could not clear saved data in this browser.");
    return;
  }

  renderCalendar();
});


document.getElementById("saveDate").addEventListener("click", () => {
  const chosenDate = document.getElementById("boxDate").value;

  if (chosenDate) {
    dates[activeDay] = chosenDate;
  } else {
    delete dates[activeDay];
  }

  try {
    localStorage.setItem("myTimetableDates", JSON.stringify(dates));
  } catch {
    alert("Could not save the date in this browser.");
    return;
  }

  editor.close();
  renderCalendar();
});

    renderCalendar();
    
  </script>
  
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import {
  getAuth, signInAnonymously
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyCL9x5HgjNsyJx_ACoNYCJbkbCxA71cyiM",
  authDomain: "my-timetable-shared.firebaseapp.com",
  projectId: "my-timetable-shared",
  storageBucket: "my-timetable-shared.firebasestorage.app",
  messagingSenderId: "433981731985",
  appId: "1:433981731985:web:d306a6f23c909afa5dfb30"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const TASKS_KEY = "myTimetable";
const DATES_KEY = "myTimetableDates";
const DRAFT_TASKS = "myTimetableLocalDraft";
const DRAFT_DATES = "myTimetableDatesLocalDraft";
const DRAFT_MARKER = "myTimetableDraftExists";

let shareId = new URLSearchParams(location.search).get("share");
let ready = false;
let applyingRemote = false;
let saveTimer;
let unsubscribe = null;

function readObject(key) {
  try {
    const value = JSON.parse(localStorage.getItem(key) || "{}");
    return value && typeof value === "object" && !Array.isArray(value)
      ? value : {};
  } catch {
    return {};
  }
}

function currentData() {
  return {
    tasks: readObject(TASKS_KEY),
    dates: readObject(DATES_KEY)
  };
}

function saveDraft() {
  localStorage.setItem(DRAFT_TASKS, JSON.stringify(readObject(TASKS_KEY)));
  localStorage.setItem(DRAFT_DATES, JSON.stringify(readObject(DATES_KEY)));
  localStorage.setItem(DRAFT_MARKER, "yes");
}

function restoreDraft() {
  if (localStorage.getItem(DRAFT_MARKER) !== "yes") {
    saveDraft();
    return;
  }

  const tasks = localStorage.getItem(DRAFT_TASKS) || "{}";
  const dates = localStorage.getItem(DRAFT_DATES) || "{}";
  const changed =
    localStorage.getItem(TASKS_KEY) !== tasks ||
    localStorage.getItem(DATES_KEY) !== dates;

  applyingRemote = true;
  localStorage.setItem(TASKS_KEY, tasks);
  localStorage.setItem(DATES_KEY, dates);
  applyingRemote = false;

  if (changed) location.reload();
}

function queueCloudSave() {
  if (!ready || applyingRemote || !shareId) return;

  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await setDoc(doc(db, "sharedTimetables", shareId), {
        ...currentData(),
        updatedAt: Date.now()
      });
    } catch (error) {
      console.error("Timetable sync failed:", error);
      alert("Could not sync your timetable. Check your internet connection and try again.");
    }
  }, 400);
}

const originalSetItem = Storage.prototype.setItem;
Storage.prototype.setItem = function(key, value) {
  originalSetItem.call(this, key, value);
  if (this === localStorage && [TASKS_KEY, DATES_KEY].includes(key)) {
    queueCloudSave();
  }
};

const originalRemoveItem = Storage.prototype.removeItem;
Storage.prototype.removeItem = function(key) {
  originalRemoveItem.call(this, key);
  if (this === localStorage && [TASKS_KEY, DATES_KEY].includes(key)) {
    queueCloudSave();
  }
};

async function openSharedTimetable(id) {
  await signInAnonymously(auth);

  const ref = doc(db, "sharedTimetables", id);
  const existing = await getDoc(ref);

  if (!existing.exists()) {
    alert("This shared timetable does not exist or its link is invalid.");
    return;
  }

  unsubscribe?.();

  unsubscribe = onSnapshot(ref, snapshot => {
    if (!snapshot.exists()) return;

    const data = snapshot.data();
    if (!data.tasks || !data.dates) return;

    const tasks = JSON.stringify(data.tasks);
    const dates = JSON.stringify(data.dates);

    const changed =
      localStorage.getItem(TASKS_KEY) !== tasks ||
      localStorage.getItem(DATES_KEY) !== dates;

    if (changed) {
      applyingRemote = true;
      localStorage.setItem(TASKS_KEY, tasks);
      localStorage.setItem(DATES_KEY, dates);
      applyingRemote = false;
      location.reload();
      return;
    }

    ready = true;
  }, error => {
    console.error("Timetable listener failed:", error);
    alert("Live sync stopped. Check your internet connection.");
  });
}

const clearButton = [...document.querySelectorAll("button")]
  .find(button => button.textContent.trim().toLowerCase() === "clear all");

if (clearButton) {
  const shareButton = document.createElement("button");
  shareButton.textContent = "Share";
  shareButton.className = clearButton.className;
  shareButton.style.marginLeft = "8px";
  clearButton.insertAdjacentElement("afterend", shareButton);

  shareButton.addEventListener("click", async () => {
    try {
      if (shareId) {
        await navigator.clipboard.writeText(location.href);
        alert("Shared timetable link copied. Send it to your friends.");
        return;
      }

      saveDraft();

      const bytes = crypto.getRandomValues(new Uint8Array(32));
      const newId = [...bytes]
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");

      await signInAnonymously(auth);

      await setDoc(doc(db, "sharedTimetables", newId), {
        ...currentData(),
        updatedAt: Date.now()
      });

      const url = new URL(location.href);
      url.searchParams.set("share", newId);
      location.href = url.toString();
    } catch (error) {
      console.error("Sharing failed:", error);
      alert("Could not create or copy the shared link. Please try again.");
    }
  });
}

if (shareId) {
  openSharedTimetable(shareId).catch(error => {
    console.error("Could not open shared timetable:", error);
    alert("Could not connect to the shared timetable. Please try again.");
  });
} else {
  restoreDraft();
}
</script>
</body>
</html>
