
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Timetable</title>
<link rel="icon" href="data:image/svg+xml,
%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📅%3C/text%3E%3C/svg%3E">


  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px;
      font-family: "Times New Roman", serif;
      background: #f7f7f2;
      color: #292d29;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 48px;
      letter-spacing: 3px;
      margin: 0;
    }

    button { font-family: inherit; }

    .clear-button {
      background: #476b50;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
    }

    .weekdays, #calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekdays div {
      background: #dce9dd;
      color: #365540;
      text-align: center;
      padding: 15px 2px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      border: 1px solid #cbd9cc;
    }

    #calendar {
      border-top: 0;
      border-left: 1px solid #d9ddd6;
    }

    .day {
      height: 160px;
      min-width: 0;
      padding: 7px;
      background: white;
      border: 0;
      border-right: 1px solid #d9ddd6;
      border-bottom: 1px solid #d9ddd6;
      text-align: left;
      overflow-y: auto;
      overflow-wrap: anywhere;
      cursor: pointer;
    }

    .day:hover { background: #f8faf7; }

    .day-number {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 13px;
    }

    .task {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 0;
      margin: 5px 0;
      padding: 6px;
      border: 0;
      border-radius: 5px;
      text-align: left;
      color: #292d29;
      cursor: pointer;
    }

    .task:hover { filter: brightness(0.96); }

    .task-title {
      font-size: 12px;
      font-weight: bold;
    }

    .task-notes {
      margin-top: 5px;
      padding-top: 4px;
      border-top: 1px solid #00000018;
      font-size: 10px;
      font-style: italic;
      line-height: 1.3;
      white-space: pre-wrap;
    }

    .green { background: #e0eee0; }
    .blue { background: #e0ebf8; }
    .pink { background: #f7e3e6; }
    .yellow { background: #f8efcc; }
    .purple { background: #ece5fa; }

    dialog {
      width: min(420px, 90%);
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 24px;
    }

    dialog::backdrop { background: #0006; }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 14px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font: inherit;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .actions button {
      padding: 10px 13px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .save {
      background: #476b50;
      color: white;
    }

    .delete {
      margin-right: auto;
      color: #a33;
      background: white;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      h1 { font-size: 27px; letter-spacing: 1px; }
      .day { height: 125px; padding: 4px; }
      .task { padding: 4px; }
      .task-title { font-size: 10px; }
      .task-notes { font-size: 9px; }
      .weekdays div {
        font-size: 9px;
        letter-spacing: 0;
        padding: 12px 1px;
      }
    }
  </style>
</head>

<body>
<header class="header">
  <h1>TIMETABLE</h1>

  <div>
      <button class="clear-button" id="clearAll">
      Clear All
    </button>
  </div>
</header>


  <div class="weekdays">
    <div>MONDAY</div>
    <div>TUESDAY</div>
    <div>WEDNESDAY</div>
    <div>THURSDAY</div>
    <div>FRIDAY</div>
    <div>SATURDAY</div>
    <div>SUNDAY</div>
  </div>

  <main id="calendar"></main>

  <dialog id="editor">
    <form id="taskForm">
      <h2 id="dayTitle">Edit task</h2>

<label for="boxDate">Date for this box (optional)</label>
<input id="boxDate" type="date">
<button type="button" id="saveDate">Save date</button>


      <label for="taskTitle">What's on the agenda?</label>
      <input id="taskTitle" maxlength="150"
             placeholder="e.g. Lecture Notes">

      <label for="taskDetails">Notes</label>
      <textarea id="taskDetails" rows="4"
                placeholder="Add reminders or extra details..."></textarea>

      <label for="taskColour">Choose a colour</label>
      <select id="taskColour">
        <option value="green">Green</option>
        <option value="blue">Blue</option>
        <option value="pink">Pink</option>
        <option value="yellow">Yellow</option>
        <option value="purple">Lavender</option>
      </select>

      <div class="actions">
        <button type="button" class="delete" id="deleteTask">
          Delete
        </button>
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="save">Save</button>
      </div>
    </form>
  </dialog>

  <script>
    const calendar = document.getElementById("calendar");
    const editor = document.getElementById("editor");
    const form = document.getElementById("taskForm");

let activeDay = null;
let activeTaskIndex = null;
let tasks = {};

let dates = {};

try {
  dates = JSON.parse(localStorage.getItem("myTimetableDates") || "{}");
  if (!dates || typeof dates !== "object" || Array.isArray(dates)) {
    dates = {};
  }
} catch {
  dates = {};
}


    const colours = ["green", "blue", "pink", "yellow", "purple"];

    // Load saved tasks and convert the old one-task format if necessary.
    try {
      const saved = JSON.parse(
        localStorage.getItem("myTimetable") || "{}"
      );

      if (saved && typeof saved === "object" && !Array.isArray(saved)) {
        for (const day in saved) {
          const entry = saved[day];

          if (Array.isArray(entry)) {
            tasks[day] = entry.filter(
              task => task && typeof task === "object"
            );
          } else if (entry && typeof entry === "object") {
            tasks[day] = [entry];
          }
        }
      }
    } catch {
      tasks = {};
    }

    function saveTasks() {
      try {
        localStorage.setItem("myTimetable", JSON.stringify(tasks));
        return true;
      } catch {
        alert("Could not save your timetable in this browser.");
        return false;
      }
    }

    function renderCalendar() {
      calendar.replaceChildren();

      for (let day = 1; day <= 31; day++) {
        const cell = document.createElement("div");
        cell.className = "day";
 
        // Clicking the empty area adds another task.
        cell.addEventListener("click", () => openEditor(day, null));

const number = document.createElement("span");
number.className = "day-number";



let displayDate = "";

const startingDay = Object.keys(dates)
  .map(Number)
  .filter(box => dates[box] && box <= day)
  .sort((a, b) => b - a)[0];

if (startingDay !== undefined) {
  const date = new Date(dates[startingDay] + "T12:00:00");
  date.setDate(date.getDate() + (day - startingDay));
  displayDate = date.getDate();
}

number.textContent = displayDate;
cell.appendChild(number);


        const dayTasks = Array.isArray(tasks[day]) ? tasks[day] : [];

        dayTasks.forEach((task, index) => {
          const bubble = document.createElement("button");
          bubble.type = "button";

          const colour = colours.includes(task.colour)
            ? task.colour : "green";

          bubble.className = "task " + colour;
          bubble.title = "Click to edit this task";

          const title = document.createElement("span");
          title.className = "task-title";
          title.textContent = task.title || "(Untitled task)";
          bubble.appendChild(title);

          if (task.details) {
            const notes = document.createElement("span");
            notes.className = "task-notes";
            notes.textContent = task.details;
            bubble.appendChild(notes);
          }

          // Clicking a bubble edits that specific task only.
          bubble.addEventListener("click", event => {
            event.stopPropagation();
            openEditor(day, index);
          });

          cell.appendChild(bubble);
        });

        calendar.appendChild(cell);
      }
    }

function openEditor(day, taskIndex) {
  activeDay = day;
  activeTaskIndex = taskIndex;

  const existing = taskIndex !== null
    ? tasks[day][taskIndex]
    : null;


document.getElementById("dayTitle").textContent =
    existing ? "Edit task" : "Add task";


  document.getElementById("taskTitle").value =
    existing?.title || "";

  document.getElementById("taskDetails").value =
    existing?.details || "";

  document.getElementById("taskColour").value =
    colours.includes(existing?.colour) ? existing.colour : "green";

  document.getElementById("boxDate").value =
    dates[day] || "";

  document.getElementById("deleteTask").hidden = !existing;

  editor.showModal();
}


    form.addEventListener("submit", event => {
      event.preventDefault();

      const title = document.getElementById("taskTitle")
        .value.trim();

      const details = document.getElementById("taskDetails")
        .value.trim();

      const colour = document.getElementById("taskColour").value;

      if (!title) {
        alert("Please enter a task title.");
        return;
      }

      const previous = JSON.stringify(tasks[activeDay] || []);

      if (!tasks[activeDay]) tasks[activeDay] = [];

      const newTask = { title, details, colour };

      if (activeTaskIndex === null) {
        // Add a new task without replacing other tasks.
        tasks[activeDay].push(newTask);
      } else {
        // Edit only the selected task.
        tasks[activeDay][activeTaskIndex] = newTask;
      }

      if (!saveTasks()) {
        tasks[activeDay] = JSON.parse(previous);
        if (tasks[activeDay].length === 0) delete tasks[activeDay];
        return;
      }

      editor.close();
      renderCalendar();
    });

    document.getElementById("deleteTask").addEventListener("click", () => {
      if (activeTaskIndex === null) return;

      const previous = JSON.stringify(tasks[activeDay]);

      tasks[activeDay].splice(activeTaskIndex, 1);

      if (tasks[activeDay].length === 0) {
        delete tasks[activeDay];
      }

      if (!saveTasks()) {
        tasks[activeDay] = JSON.parse(previous);
        return;
      }

      editor.close();
      renderCalendar();
    });

    document.getElementById("cancel").addEventListener("click", () => {
      editor.close();
    });


document.getElementById("clearAll").addEventListener("click", () => {
  if (!confirm("Are you sure you want to clear all your timetable entries and dates?")) {
    return;
  }

  tasks = {};
  dates = {};

  try {
    localStorage.removeItem("myTimetable");
    localStorage.removeItem("myTimetableDates");
  } catch {
    alert("Could not clear saved data in this browser.");
    return;
  }

  renderCalendar();
});


document.getElementById("saveDate").addEventListener("click", () => {
  const chosenDate = document.getElementById("boxDate").value;

  if (chosenDate) {
    dates[activeDay] = chosenDate;
  } else {
    delete dates[activeDay];
  }

  try {
    localStorage.setItem("myTimetableDates", JSON.stringify(dates));
  } catch {
    alert("Could not save the date in this browser.");
    return;
  }

  editor.close();
  renderCalendar();
});

    renderCalendar();
    
  </script>
  

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCL9x5HgjNsyJx_ACoNYCJbkbCxA71cyiM",
  authDomain: "my-timetable-shared.firebaseapp.com",
  projectId: "my-timetable-shared",
  storageBucket: "my-timetable-shared.firebasestorage.app",
  messagingSenderId: "433981731985",
  appId: "1:433981731985:web:d306a6f23c909afa5dfb30"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const TASKS_KEY = "myTimetable";
const DATES_KEY = "myTimetableDates";
const shareId = new URLSearchParams(location.search).get("share");

let ready = false;
let applyingRemote = false;
let saveTimer;
let sharedRef = null;
let sharedData = null;

function readObject(key) {
  try {
    const v = JSON.parse(localStorage.getItem(key) || "{}");
    return v && typeof v === "object" && !Array.isArray(v) ? v : {};
  } catch {
    return {};
  }
}

function currentData() {
  return {
    tasks: readObject(TASKS_KEY),
    dates: readObject(DATES_KEY)
  };
}

async function signIn() {
  const result = await signInWithPopup(auth, provider);
  if (!result.user.email || !result.user.emailVerified) {
    throw new Error("Use a Google account with a verified email.");
  }
  return result.user;
}

function canRead(data, user) {
  return data.ownerUid === user.uid ||
    ["editor", "viewer"].includes(
      data.invitedEmails?.[user.email?.toLowerCase()]
    );
}

function queueCloudSave() {
  if (!ready || applyingRemote || !sharedRef) return;

  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await setDoc(sharedRef, {
        ...currentData(),
        updatedAt: Date.now()
      }, { merge: true });
    } catch (error) {
      console.error("Sync failed:", error);
      alert("Could not sync. Check your access and internet connection.");
    }
  }, 400);
}

const originalSetItem = Storage.prototype.setItem;
Storage.prototype.setItem = function(key, value) {
  originalSetItem.call(this, key, value);
  if (this === localStorage &&
      [TASKS_KEY, DATES_KEY].includes(key)) queueCloudSave();
};

const originalRemoveItem = Storage.prototype.removeItem;
Storage.prototype.removeItem = function(key) {
  originalRemoveItem.call(this, key);
  if (this === localStorage &&
      [TASKS_KEY, DATES_KEY].includes(key)) queueCloudSave();
};

const buttons = [...document.querySelectorAll("button")];
const clearButton = buttons.find(
  b => b.textContent.trim().toLowerCase() === "clear all"
);

function addButton(label, after, handler) {
  const button = document.createElement("button");
  button.textContent = label;
  if (after) {
    button.className = after.className;
    button.style.marginLeft = "8px";
    after.insertAdjacentElement("afterend", button);
  } else {
    clearButton?.insertAdjacentElement("afterend", button);
  }
  button.addEventListener("click", async () => {
    try {
      await handler();
    } catch (error) {
      console.error(error);
      alert(error.message || "Something went wrong. Please try again.");
    }
  });
  return button;
}

async function openShared(id, user) {
  const ref = doc(db, "sharedTimetables", id);
  const snap = await getDoc(ref);

  if (!snap.exists()) throw new Error("This timetable does not exist.");

  const data = snap.data();
  if (!canRead(data, user)) {
    throw new Error("Your Google account has not been invited to this timetable.");
  }

  sharedRef = ref;
  sharedData = data;

  onSnapshot(ref, snapshot => {
    if (!snapshot.exists()) return;
    const remote = snapshot.data();

    const tasks = JSON.stringify(remote.tasks || {});
    const dates = JSON.stringify(remote.dates || {});
    const changed =
      localStorage.getItem(TASKS_KEY) !== tasks ||
      localStorage.getItem(DATES_KEY) !== dates;

    sharedData = remote;

    if (changed) {
      applyingRemote = true;
      localStorage.setItem(TASKS_KEY, tasks);
      localStorage.setItem(DATES_KEY, dates);
      applyingRemote = false;
      location.reload();
      return;
    }

    ready = true;
  }, error => {
    console.error(error);
    alert("Live sync failed. Check your connection and access.");
  });

  if (data.ownerUid === user.uid) {
    addInviteButton();
  }
}

function addInviteButton() {
  if (document.getElementById("inviteButton")) return;

  const button = document.createElement("button");
  button.id = "inviteButton";
  button.textContent = "Invite by email";
  button.style.marginLeft = "8px";
  const shareButton = document.getElementById("shareButton");
  shareButton?.insertAdjacentElement("afterend", button);

  button.addEventListener("click", async () => {
    const email = prompt("Enter the person's Google account email:");
    if (!email || !email.trim()) return;

    const normalized = email.trim().toLowerCase();
    const roleInput = prompt("Type editor or viewer:", "editor");
    if (!roleInput) return;

    const role = roleInput.trim().toLowerCase();
    if (!["editor", "viewer"].includes(role)) {
      alert("Choose editor or viewer.");
      return;
    }

    const latest = await getDoc(sharedRef);
    if (!latest.exists() || latest.data().ownerUid !== auth.currentUser.uid) {
      throw new Error("Only the owner can invite people.");
    }

    const invitedEmails = { ...(latest.data().invitedEmails || {}) };
    invitedEmails[normalized] = role;
    await updateDoc(sharedRef, { invitedEmails });
    alert("Invitation permission saved. Send the timetable link to " + normalized + ".");
  });
}

const shareButton = addButton("Share", clearButton, async () => {
  const user = await signIn();

  if (shareId) {
    const snap = await getDoc(doc(db, "sharedTimetables", shareId));
    if (!snap.exists() || !canRead(snap.data(), user)) {
      throw new Error("Your Google account is not authorised for this timetable.");
    }
    await navigator.clipboard.writeText(location.href);
    alert("Timetable link copied. Only invited accounts can open it.");
    return;
  }

  const bytes = crypto.getRandomValues(new Uint8Array(32));
  const newId = [...bytes].map(b => b.toString(16).padStart(2, "0")).join("");

  await setDoc(doc(db, "sharedTimetables", newId), {
    ownerUid: user.uid,
    invitedEmails: {},
    ...currentData(),
    updatedAt: Date.now()
  });

  const url = new URL(location.href);
  url.searchParams.set("share", newId);
  location.href = url.toString();
});
shareButton.id = "shareButton";

const signInButton = addButton("Sign in with Google", null, async () => {
  const user = await signIn();
  if (shareId) {
    await openShared(shareId, user);
  } else {
    alert("Signed in. Click Share to create a private shared timetable.");
  }
});

if (shareId) {
  // Sign-in requires a user click; access is checked after Google sign-in.
  signInButton.textContent = "Sign in to open timetable";
} else {
  // Keep your existing local timetable available when not sharing.
  signInButton.remove();
}
</script>
</body>
</html>
